[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trkfastsim"
version = "0.0.1"
description = "Geant4-free tracker simulation and fast reconstruction for the Mu2e extracted (KPP) configuration"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["mu2efastsim", "numpy", "pandas", "uproot"]

[project.optional-dependencies]
jax = ["jax"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["trkfastsim*"]
