[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crvfastsim"
version = "0.2.0"
description = "Geant4-free CRV simulation and fast CRV reconstruction for the Mu2e extracted (KPP) configuration"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["mu2efastsim", "numpy", "pandas", "uproot", "awkward", "matplotlib", "scipy", "pyyaml", "pyarrow",
                "scint-fibre-fastsim @ git+https://github.com/RobMina/scint-fibre-fastsim.git@41c7f1b0685dabcd088ccdd487318f8a7840431d"]

[project.optional-dependencies]
jax = ["jax"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["crvfastsim*"]

[tool.setuptools.package-data]
crvfastsim = ["configs/*.json"]
