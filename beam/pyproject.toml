[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamfastsim"
version = "0.0.1"
description = "Geant4-free muon beam transport from the Mu2e DS entrance to the stopping target (prototype)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["mu2efastsim", "numpy", "scipy", "uproot", "awkward", "jax"]

[project.optional-dependencies]
plots = ["matplotlib"]
test = ["pytest"]
tracker = ["trkfastsim", "pandas"]   # cetracker: hand-off to the field-on tracker
reco = ["pandas", "awkward"]   # dioreco: EventNtuple readers
edepana = ["calofastsim", "trkfastsim", "pandas"]   # edepana: calorimeter showers and the tracker device chain
# centuple: the calorimeter and tracker device chains, the umbrella's trigger package, and ROOT (PyROOT with the
# EventNtuple dictionaries of the stock Mu2e release, for the writer; not installable from PyPI)
centuple = ["calofastsim", "trkfastsim", "trigger", "ROOT", "pandas"]

[project.scripts]
beamfastsim = "beamfastsim.__main__:main"

[tool.setuptools.packages.find]
include = ["beamfastsim*"]

[tool.setuptools.package-data]
beamfastsim = ["data/*.csv", "data/*.json", "centuple/data/*.npz"]

