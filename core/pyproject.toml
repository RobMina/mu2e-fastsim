[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mu2efastsim"
version = "0.1.0"
description = "Detector-independent core of the Mu2e Geant4-free fast simulation (energy loss, materials, world, crossings, tables)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
# hep-endpoints (import name hependpoints): the experiment-neutral endpoint adapters, needed on the kit host only
# (jobs do not import it); pinned to a commit of RobMina/hep-endpoints (not on PyPI), the same pin as
# ci/requirements.txt. For development install a local checkout with pip install -e first.
# scint-fibre-fastsim (import name scintfibrefastsim): the experiment-neutral lookupgen.core that
# crvfastsim.lookupgen.core re-exports; pinned in crv/pyproject.toml and ci/requirements.txt.
# hep-simlib (import name hepsimlib): the experiment-neutral library core and component banks that
# mu2efastsim.library and mu2efastsim.component_response re-export with the Mu2e profile; same pin as
# ci/requirements.txt.
# hep-simbench (import name hepsimbench): the experiment-neutral scorer, warm-rate timer, approximation registry and
# robust statistics behind mu2efastsim.bench, .approximations, .stats and benchmarks/; same pin as ci/requirements.txt.
dependencies = ["numpy", "pandas", "uproot", "matplotlib", "scipy", "hep-endpoints @ git+https://github.com/RobMina/hep-endpoints.git@caa585711a3610fa8746fc16ab729f74b2f401b6",
                "cryjax @ git+https://github.com/RobMina/cryjax.git@4b5f0df4965b895f3296543a3d42bc2ab04d6909",
                "hep-simlib @ git+https://github.com/RobMina/hep-simlib.git@b5868350f789f49dfc174110e72d55a40758de67",
                "hep-simbench @ git+https://github.com/RobMina/hep-simbench.git@5d3eab140474f29301269df19bebec0cd387a261"]

[project.optional-dependencies]
jax = ["jax"]
kit = ["mcp"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["mu2efastsim*"]

[tool.setuptools.package-data]
mu2efastsim = ["data/*.npz", "data/*.json"]
