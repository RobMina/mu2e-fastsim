[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mu2efastsim"
version = "0.1.0"
description = "Detector-independent core of the Mu2e Geant4-free fast simulation (energy loss, materials, world, crossings, tables)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
# hep-endpoints (import name hependpoints): the experiment-neutral endpoint adapters, needed on the kit host only
# (jobs do not import it); pinned to a commit of RobMina/hep-endpoints (not on PyPI), the same pin as
# ci/requirements.txt. For development install a local checkout with pip install -e first.
# hep-simlib (import name hepsimlib): the experiment-neutral library core and component banks that
# mu2efastsim.library and mu2efastsim.component_response re-export with the Mu2e profile; same pin as
# ci/requirements.txt.
dependencies = ["numpy", "pandas", "uproot", "matplotlib", "scipy", "hep-endpoints @ git+https://github.com/RobMina/hep-endpoints.git@ab3cd9fd4f870d463c599d7aef78773ded98c6d0",
                "cryjax @ git+https://github.com/RobMina/cryjax.git@3094804ba73f1d8f9b36665e30c6c64fa0a063d0",
                "hep-simlib @ git+https://github.com/RobMina/hep-simlib.git@22e160ddb973f863e2639e19553e5e5c3aa4f8bf"]

[project.optional-dependencies]
jax = ["jax"]
kit = ["mcp"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["mu2efastsim*"]

[tool.setuptools.package-data]
mu2efastsim = ["data/*.npz", "data/*.json"]
