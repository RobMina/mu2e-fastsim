[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mu2efastsim"
version = "0.1.0"
description = "Detector-independent core of the Mu2e Geant4-free fast simulation (energy loss, materials, world, crossings, tables)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
# hep-endpoints (import name hependpoints): the experiment-neutral endpoint adapters, needed on the kit host only
# (jobs do not import it); pinned to a commit of RobMina/hep-endpoints (not on PyPI), the same pin as
# ci/requirements.txt. For development install a local checkout with pip install -e first.
# hep-simlib (import name hepsimlib): the experiment-neutral library core and component banks that
# mu2efastsim.library and mu2efastsim.component_response re-export with the Mu2e profile; same pin as
# ci/requirements.txt.
dependencies = ["numpy", "pandas", "uproot", "matplotlib", "scipy", "hep-endpoints @ git+https://github.com/RobMina/hep-endpoints.git@536656008f457eefb5939cdbe1095cbdf445857d",
                "cryjax @ git+https://github.com/RobMina/cryjax.git@8ca6f546c817cf311fd4a4c15fa31288fba31fb6",
                "hep-simlib @ git+https://github.com/RobMina/hep-simlib.git@c451ee6d144515bb700078441688cdda4fe9563a"]

[project.optional-dependencies]
jax = ["jax"]
kit = ["mcp"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["mu2efastsim*"]

[tool.setuptools.package-data]
mu2efastsim = ["data/*.npz", "data/*.json"]
