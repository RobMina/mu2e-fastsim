# Test every package of the repository on pull requests and main, one job per suite.
# The "suite (...)" jobs are the status checks of the main branch; the "no JAX (...)" jobs run the same suites without
# JAX installed, where the JAX tests must skip cleanly.
name: tests
# Pull requests and pushes run the per-PR tier; on a pull request a suite whose own directory and dependencies (deps)
# did not change only reports success. The nightly schedule (and a manual run with runslow) runs every suite with
# --runslow (the @pytest.mark.slow tests); a pull request that changes a path listed in the suite's
# ci/runslow_paths.txt runs that suite with --runslow too. The weekly schedule (and a manual run with weekly) runs only
# the @pytest.mark.weekly validations of the core suite (--runweekly -m weekly). Tiers: .github/ci_tier.sh.
# JAX's persistent compilation cache is kept per suite and tier (pr, slow, weekly): restored from main's last run of
# the same tier (else of any tier) and saved by runs on main, so the nightly keeps the programs of the slow tests.
# After a save, older caches of the same suite and tier are deleted (.github/jax_cache_prune.sh) to stay in the budget.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * *"    # nightly: --runslow
    - cron: "11 3 * * 0"    # weekly (Sunday): core suite, --runweekly -m weekly (WEEKLY_CRON in ci_tier.sh)
  workflow_dispatch:
    inputs:
      runslow:
        description: "also run the @pytest.mark.slow tests (--runslow)"
        type: boolean
        default: true
      weekly:
        description: "run only the @pytest.mark.weekly validations of the core suite (--runweekly -m weekly); overrides runslow"
        type: boolean
        default: false
permissions:
  contents: read
# A pull request or a push to main cancels the older run of its own group. Scheduled and manual runs have their own
# group and are never cancelled, so a push to main does not cancel the nightly or weekly tier (a new one waits).
concurrency:
  group: tests-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
jobs:
  suite:
    name: suite (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write    # .github/jax_cache_prune.sh deletes this suite's older caches after a save on main
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            dir: core
            path: core:crv:beam
            deps: '^(core|crv|beam)(/|$)'
          - suite: crv
            dir: crv
            path: crv:core
            deps: '^(crv|core)(/|$)'
          - suite: tracker
            dir: tracker
            path: tracker:core
            deps: '^(tracker|core)(/|$)'
          - suite: beam
            dir: beam
            path: beam:core:calo           # beamfastsim.edepana draws calorimeter showers (calofastsim)
            deps: '^(beam|core|calo)(/|$)'
          - suite: umbrella
            dir: .
            path: beam:core:tracker:crv
            deps: '.'
          - suite: calo
            dir: calo
            path: calo:beam:core
            deps: '^(calo|core|beam)(/|$)'
    env:
      JAX_PLATFORMS: cpu
      PYTHONDONTWRITEBYTECODE: "1"
      JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax-cache
      JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
      JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide (run or skip; per-PR tier or --runslow)
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_RUNSLOW: ${{ inputs.runslow }}
          DISPATCH_WEEKLY: ${{ inputs.weekly }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEPS: ${{ matrix.deps }}
          SUITE: ${{ matrix.suite }}
          DIR: ${{ matrix.dir }}
        run: bash .github/ci_tier.sh
      - uses: actions/setup-python@v5
        if: steps.tier.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: core/ci/requirements.txt
      - name: Python packages
        if: steps.tier.outputs.run == 'true'
        run: python -m pip install -q -r core/ci/requirements.txt
      - name: Cache key month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore the JAX compilation cache
        if: steps.tier.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .jax-cache
          key: jax-${{ matrix.suite }}-${{ steps.month.outputs.month }}-${{ hashFiles('core/ci/requirements.txt') }}-${{ steps.tier.outputs.tier }}-${{ github.sha }}
          restore-keys: |
            jax-${{ matrix.suite }}-${{ steps.month.outputs.month }}-${{ hashFiles('core/ci/requirements.txt') }}-${{ steps.tier.outputs.tier }}-
            jax-${{ matrix.suite }}-${{ steps.month.outputs.month }}-${{ hashFiles('core/ci/requirements.txt') }}-
      - name: Install beam as a package
        if: matrix.suite == 'beam' && steps.tier.outputs.run == 'true'
        run: |
          python -m pip install -q --no-deps ./beam
          cd "$RUNNER_TEMP" && python -c "import beamfastsim; print(beamfastsim.__file__)"
      - name: Public Offline files
        if: steps.tier.outputs.run == 'true'
        run: |
          bash core/ci/offline_data.sh "$RUNNER_TEMP/offline_data"
          echo "MU2E_SEARCH_PATH=$RUNNER_TEMP/offline_data" >> "$GITHUB_ENV"
      - name: pytest
        if: steps.tier.outputs.run == 'true'
        run: |
          export PYTHONPATH=$(echo "${{ matrix.path }}" | tr ':' '\n' | sed "s#^#$GITHUB_WORKSPACE/#" | paste -sd:)
          if [ "${{ matrix.suite }}" = umbrella ]; then
            python -m pytest -q -p no:cacheprovider ${{ steps.tier.outputs.args }} tests
            python -m pytest -q -p no:cacheprovider container/tests
          else
            cd "${{ matrix.dir }}" && python -m pytest -q -p no:cacheprovider --durations=15 ${{ steps.tier.outputs.args }} tests
          fi
      - name: Save the JAX compilation cache (main only)
        if: steps.tier.outputs.run == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .jax-cache
          key: jax-${{ matrix.suite }}-${{ steps.month.outputs.month }}-${{ hashFiles('core/ci/requirements.txt') }}-${{ steps.tier.outputs.tier }}-${{ github.sha }}
      - name: Prune older JAX caches of this suite and tier (main only; elsewhere list them)
        if: steps.tier.outputs.run == 'true'
        continue-on-error: true    # a failed prune never fails the suite
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'delete' || 'list' }}
        run: bash .github/jax_cache_prune.sh "${{ matrix.suite }}" "${{ steps.tier.outputs.tier }}" "jax-${{ matrix.suite }}-${{ steps.month.outputs.month }}-${{ hashFiles('core/ci/requirements.txt') }}-${{ steps.tier.outputs.tier }}-${{ github.sha }}" "$MODE"
  nojax:
    name: no JAX (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            dir: core
            path: core:crv:beam
            deps: '^(core|crv|beam)(/|$)'
          - suite: crv
            dir: crv
            path: crv:core
            deps: '^(crv|core)(/|$)'
          - suite: tracker
            dir: tracker
            path: tracker:core
            deps: '^(tracker|core)(/|$)'
          - suite: beam
            dir: beam
            path: beam:core:calo           # beamfastsim.edepana draws calorimeter showers (calofastsim)
            deps: '^(beam|core|calo)(/|$)'
          - suite: umbrella
            dir: .
            path: beam:core:tracker:crv
            deps: '.'
          - suite: calo
            dir: calo
            path: calo:beam:core
            deps: '^(calo|core|beam)(/|$)'
    env:
      JAX_PLATFORMS: cpu
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide (run or skip)
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_WEEKLY: ${{ inputs.weekly }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEPS: ${{ matrix.deps }}
          SUITE: ${{ matrix.suite }}
          DIR: ${{ matrix.dir }}
          NOJAX: "true"
        run: bash .github/ci_tier.sh
      - uses: actions/setup-python@v5
        if: steps.tier.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: core/ci/requirements.txt
      - name: Python packages without JAX
        if: steps.tier.outputs.run == 'true'
        run: |
          grep -v -E '^(jax|jaxlib)==' core/ci/requirements.txt > "$RUNNER_TEMP/requirements-nojax.txt"
          python -m pip install -q -r "$RUNNER_TEMP/requirements-nojax.txt"
          if python -c 'import jax' 2>/dev/null; then echo 'JAX is installed'; exit 1; fi
      - name: Public Offline files
        if: steps.tier.outputs.run == 'true'
        run: |
          bash core/ci/offline_data.sh "$RUNNER_TEMP/offline_data"
          echo "MU2E_SEARCH_PATH=$RUNNER_TEMP/offline_data" >> "$GITHUB_ENV"
      - name: pytest
        if: steps.tier.outputs.run == 'true'
        run: |
          export PYTHONPATH=$(echo "${{ matrix.path }}" | tr ':' '\n' | sed "s#^#$GITHUB_WORKSPACE/#" | paste -sd:)
          if [ "${{ matrix.suite }}" = umbrella ]; then
            python -m pytest -q -p no:cacheprovider tests
            python -m pytest -q -p no:cacheprovider container/tests
          else
            cd "${{ matrix.dir }}" && python -m pytest -q -p no:cacheprovider --durations=15 tests
          fi
